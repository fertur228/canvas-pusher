name: FlyMind bounded telemetry retention
on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Expire old references and remove unreferenced artifacts (also requires repository retention flag)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: flymind-retention
  cancel-in-progress: false
jobs:
  retention:
    if: vars.FLYMIND_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || vars.FLYMIND_RETENTION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Bounded retention, dry-run unless explicitly activated
        env:
          FLYMIND_ENABLED: 'true'
          FLYMIND_RETENTION_ENABLED: ${{ vars.FLYMIND_RETENTION_ENABLED || 'false' }}
          FLYMIND_ACCOUNT_ID: ${{ vars.FLYMIND_ACCOUNT_ID }}
          DELIVERY_MODE: ${{ vars.DELIVERY_MODE || 'disabled' }}
          FLYMIND_PRODUCTION_AUTHORIZED: ${{ vars.FLYMIND_PRODUCTION_AUTHORIZED || 'false' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM_CHAT_ID: ${{ secrets.TEST_TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APPLY_RETENTION: ${{ github.event_name == 'schedule' || inputs.apply == true }}
        run: |
          if [ "$APPLY_RETENTION" = "true" ]; then
            python -m src.flymind.maintenance retention --days 30 --apply
          else
            python -m src.flymind.maintenance retention --days 30
          fi
