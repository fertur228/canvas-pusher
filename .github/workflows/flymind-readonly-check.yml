name: FlyMind controlled Canvas read
on:
  push:
    branches: [feat/flymind-neural-poc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canvas-read:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[canvas-read-check]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.lock
      - name: Read Canvas only; no database writes or Telegram credentials
        env:
          CANVAS_API_URL: ${{ secrets.CANVAS_API_URL }}
          CANVAS_API_KEY: ${{ secrets.CANVAS_API_KEY }}
        run: python -m src.flymind.live_check
