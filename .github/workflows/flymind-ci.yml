name: FlyMind verification
on:
  push:
    branches: [feat/flymind-neural-poc]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flymind-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - run: pip install -r requirements-neural.lock
      - run: python scripts/check_repository.py
      - run: python -m pytest -q --tb=short --disable-warnings --show-capture=no
      - run: deno test supabase/functions/telegram-webhook/handler_test.ts
      - run: npm ci --prefix dashboard
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: npm --prefix dashboard run test:e2e
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - run: npm --prefix dashboard run test:e2e:private
        env:
          PLAYWRIGHT_CHROME_PATH: /usr/bin/google-chrome
      - name: Real Linux x86 neural controls and runtime
        run: python -m src.flymind.evaluate --output /tmp/flymind-linux-evaluation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-linux-scientific-evaluation
          path: /tmp/flymind-linux-evaluation.json
          retention-days: 14

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python tests/flymind/postgres_checks.py --socket 127.0.0.1 --port 55439 --psql psql
        env:
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-only
